services:
  mysql:
    container_name: mysql
    image: mysql
    platform: linux/arm64
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: secret
    expose:
      - "3306"
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  auth-server:
    container_name: auth-server
    image: spring-6-auth-server:0.0.1-SNAPSHOT
    platform: linux/arm64
    expose:
      - "9000"
  rest-mvc:
    container_name: rest-mvc
    image: docker.io/library/spring-6-rest-mvc:0.0.1-SNAPSHOT
    platform: linux/arm64
    environment:
      - SPRING_PROFILES_ACTIVE=localmysql
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/mydatabase
      - SERVER_PORT=8080
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    expose:
      - "8080"
  icecold-service:
    container_name: icecold-service
    image: docker.io/library/spring-6-icecold-service:0.0.1-SNAPSHOT
    platform: linux/arm64
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    expose:
      - "8080"
  cold-service:
    container_name: cold-service
    image: docker.io/library/spring-6-cold-service:0.0.1-SNAPSHOT
    platform: linux/arm64
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    expose:
      - "8080"
  cool-service:
    container_name: cool-service
    image: docker.io/library/spring-6-cool-service:0.0.1-SNAPSHOT
    platform: linux/arm64
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    expose:
      - "8080"
  gateway:
    container_name: gateway
    image: docker.io/library/spring-6-gateway:0.0.1-SNAPSHOT
    platform: linux/arm64
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SERVER_PORT=8080
    depends_on:
      - auth-server
      - rest-mvc
    ports:
      - "8080:8080"
    expose:
      - "8080"
